name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import master_check; print(master_check.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build MasterCheck.exe
        run: pyinstaller --noconfirm --windowed --name MasterCheck app.py
      - name: Smoke test the build
        shell: pwsh
        run: |
          $p = Start-Process dist/MasterCheck/MasterCheck.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          $v = python -c "import master_check; print(master_check.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "installer\Output\MasterCheck-Setup-$v.exe" "MasterCheck-Setup.exe"
      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $p = Start-Process "MasterCheck-Setup.exe" -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Master Check\MasterCheck.exe"
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MasterCheck-Windows
          path: MasterCheck-Setup.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build Master Check.app
        run: |
          v=$(python -c "import master_check; print(master_check.__version__)")
          pyinstaller --noconfirm --windowed --name "Master Check" \
            --osx-bundle-identifier com.rommuser.mastercheck app.py
          plutil -replace CFBundleShortVersionString -string "$v" "dist/Master Check.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$v" "dist/Master Check.app/Contents/Info.plist"
      - name: Smoke test
        run: '"dist/Master Check.app/Contents/MacOS/Master Check" --selftest'
      - name: Build MasterCheck.dmg
        run: |
          mkdir dmg
          cp -R "dist/Master Check.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Master Check" -srcfolder dmg -ov -format UDZO MasterCheck.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MasterCheck-macOS
          path: MasterCheck.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?%s\]?.*?$(.*?)(?=^## |\Z)" % re.escape(v), text, re.M | re.S)
          notes = (m.group(1).strip() if m else "") + (
              "\n\n### Download\n\n"
              "- Windows: `MasterCheck-Setup.exe`\n"
              "- macOS (Apple silicon): `MasterCheck.dmg`\n\n"
              "The installers are not code-signed yet. See the README for the one-time "
              "warning on first launch.\n")
          open("notes.md", "w", encoding="utf-8").write(notes)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            MasterCheck-Windows/MasterCheck-Setup.exe
            MasterCheck-macOS/MasterCheck.dmg
